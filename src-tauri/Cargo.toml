[package]
name = "question-sort-pdf"
version = "0.1.0"
description = "A lightweight, local-first desktop app for arranging exam images into a verified PDF."
authors = []
edition = "2024"

[lib]
name = "question_sort_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
